name: Sync website assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-assets:
    if: github.event.head_commit.message != 'Sync website assets into assets/'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror root image assets
        run: |
          mkdir -p assets
          find . -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -exec cp -f {} assets/ \;

      - name: Commit mirrored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet && exit 0
          git commit -m "Sync website assets into assets/"
          git push
